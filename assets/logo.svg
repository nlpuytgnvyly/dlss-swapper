<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f14"/>
      <stop offset="100%" stop-color="#0e151c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" fill="url(#bgGrad)"/>

  <!-- Subtle grid lines -->
  <g stroke="#e6edf3" stroke-width="0.4" opacity="0.06">
    <line x1="0" y1="64" x2="256" y2="64"/>
    <line x1="0" y1="128" x2="256" y2="128"/>
    <line x1="0" y1="192" x2="256" y2="192"/>
    <line x1="64" y1="0" x2="64" y2="256"/>
    <line x1="128" y1="0" x2="128" y2="256"/>
    <line x1="192" y1="0" x2="192" y2="256"/>
  </g>

  <!-- Main die housing - off-center composition -->
  <g transform="translate(128, 126)">

    <!-- Outer die frame: chamfered square, technical -->
    <polygon points="-88,-88 -72,-96 72,-96 88,-88 96,-72 96,72 88,88 72,96 -72,96 -88,88 -96,72 -96,-72"
             fill="none" stroke="#e6edf3" stroke-width="2.5" opacity="0.9"/>

    <!-- Inner die substrate -->
    <polygon points="-72,-72 -60,-78 60,-78 72,-72 78,-60 78,60 72,72 60,78 -60,78 -72,72 -78,60 -78,-60"
             fill="#0b0f14" stroke="#39d353" stroke-width="1.2" opacity="0.8"/>

    <!-- Core die area - cross-section pattern -->
    <!-- Central processing unit block -->
    <polygon points="-40,-40 -24,-52 24,-52 40,-40 40,40 24,52 -24,52 -40,40"
             fill="#0b0f14" stroke="#7cf7a0" stroke-width="1.8"/>

    <!-- Interlocking rail slots - the "swap" mechanism -->
    <!-- Top rail (left offset) -->
    <g>
      <!-- Rail slot A: feeds in from top-left -->
      <polygon points="-68,-60 -52,-60 -48,-52 -48,-36 -52,-28 -68,-28 -72,-36 -72,-52"
               fill="#0b0f14" stroke="#39d353" stroke-width="1.5"/>
      <!-- Rail channel indent -->
      <line x1="-60" y1="-60" x2="-60" y2="-28" stroke="#39d353" stroke-width="1" opacity="0.6"/>
      <!-- Swap indicator notch -->
      <polygon points="-58,-60 -54,-64 -50,-60 -54,-56" fill="#7cf7a0" opacity="0.8"/>

      <!-- Rail slot B: feeds in from bottom-right, interlocking -->
      <polygon points="48,28 52,36 52,52 48,60 68,60 72,52 72,36 68,28"
               fill="#0b0f14" stroke="#39d353" stroke-width="1.5"/>
      <line x1="60" y1="28" x2="60" y2="60" stroke="#39d353" stroke-width="1" opacity="0.6"/>
      <!-- Swap indicator notch -->
      <polygon points="58,60 54,64 50,60 54,56" fill="#7cf7a0" opacity="0.8"/>
    </g>

    <!-- Right side rail pair -->
    <g>
      <!-- Rail C: right side upper -->
      <polygon points="48,-60 60,-60 64,-52 64,-36 60,-28 48,-28 44,-36 44,-52"
               fill="#0b0f14" stroke="#39d353" stroke-width="1.5"/>
      <line x1="52" y1="-60" x2="52" y2="-28" stroke="#39d353" stroke-width="1" opacity="0.6"/>
      <polygon points="54,-60 58,-64 62,-60 58,-56" fill="#7cf7a0" opacity="0.7"/>

      <!-- Rail D: left side lower -->
      <polygon points="-64,28 -60,36 -60,52 -64,60 -48,60 -44,52 -44,36 -48,28"
               fill="#0b0f14" stroke="#39d353" stroke-width="1.5"/>
      <line x1="-52" y1="28" x2="-52" y2="60" stroke="#39d353" stroke-width="1" opacity="0.6"/>
      <polygon points="-54,60 -58,64 -62,60 -58,56" fill="#7cf7a0" opacity="0.7"/>
    </g>

    <!-- Central die core with swap arrows -->
    <g>
      <!-- Core chip -->
      <polygon points="-18,-18 -8,-26 8,-26 18,-18 18,18 8,26 -8,26 -18,18"
               fill="#0b0f14" stroke="#e6edf3" stroke-width="1.5"/>

      <!-- Swap arrow 1: pointing right-up -->
      <polyline points="-10,8 -2,8 6,-2" fill="none" stroke="#7cf7a0" stroke-width="2" stroke-linecap="square"/>
      <polygon points="8,-4 4,2 10,4" fill="#7cf7a0"/>

      <!-- Swap arrow 2: pointing left-down -->
      <polyline points="10,-8 2,-8 -6,2" fill="none" stroke="#7cf7a0" stroke-width="2" stroke-linecap="square"/>
      <polygon points="-8,4 -4,-2 -10,-4" fill="#7cf7a0"/>
    </g>

    <!-- Micro-mechanical detailing: solder dots around die -->
    <g fill="#e6edf3" opacity="0.3">
      <circle cx="-80" cy="-80" r="1.5"/>
      <circle cx="80" cy="-80" r="1.5"/>
      <circle cx="-80" cy="80" r="1.5"/>
      <circle cx="80" cy="80" r="1.5"/>
      <circle cx="-88" cy="-56" r="1"/>
      <circle cx="88" cy="-56" r="1"/>
      <circle cx="-88" cy="56" r="1"/>
      <circle cx="88" cy="56" r="1"/>
      <circle cx="-56" cy="-88" r="1"/>
      <circle cx="56" cy="-88" r="1"/>
      <circle cx="-56" cy="88" r="1"/>
      <circle cx="56" cy="88" r="1"/>
    </g>

    <!-- Edge connector pins - top -->
    <g stroke="#39d353" stroke-width="1.8" opacity="0.7">
      <line x1="-40" y1="-96" x2="-40" y2="-88"/>
      <line x1="-24" y1="-96" x2="-24" y2="-88"/>
      <line x1="-8" y1="-96" x2="-8" y2="-88"/>
      <line x1="8" y1="-96" x2="8" y2="-88"/>
      <line x1="24" y1="-96" x2="24" y2="-88"/>
      <line x1="40" y1="-96" x2="40" y2="-88"/>
    </g>

    <!-- Edge connector pins - bottom -->
    <g stroke="#39d353" stroke-width="1.8" opacity="0.7">
      <line x1="-40" y1="88" x2="-40" y2="96"/>
      <line x1="-24" y1="88" x2="-24" y2="96"/>
      <line x1="-8" y1="88" x2="-8" y2="96"/>
      <line x1="8" y1="88" x2="8" y2="96"/>
      <line x1="24" y1="88" x2="24" y2="96"/>
      <line x1="40" y1="88" x2="40" y2="96"/>
    </g>

    <!-- Left side pins -->
    <g stroke="#39d353" stroke-width="1.8" opacity="0.7">
      <line x1="-96" y1="-40" x2="-88" y2="-40"/>
      <line x1="-96" y1="-24" x2="-88" y2="-24"/>
      <line x1="-96" y1="-8" x2="-88" y2="-8"/>
      <line x1="-96" y1="8" x2="-88" y2="8"/>
      <line x1="-96" y1="24" x2="-88" y2="24"/>
      <line x1="-96" y1="40" x2="-88" y2="40"/>
    </g>

    <!-- Right side pins -->
    <g stroke="#39d353" stroke-width="1.8" opacity="0.7">
      <line x1="88" y1="-40" x2="96" y2="-40"/>
      <line x1="88" y1="-24" x2="96" y2="-24"/>
      <line x1="88" y1="-8" x2="96" y2="-8"/>
      <line x1="88" y1="8" x2="96" y2="8"/>
      <line x1="88" y1="24" x2="96" y2="24"/>
      <line x1="88" y1="40" x2="96" y2="40"/>
    </g>

    <!-- Corner accent markers -->
    <g fill="#7cf7a0" opacity="0.5">
      <polygon points="-96,-72 -88,-72 -88,-80 -96,-80"/>
      <polygon points="88,-72 96,-72 96,-80 88,-80"/>
      <polygon points="-96,72 -88,72 -88,80 -96,80"/>
      <polygon points="88,72 96,72 96,80 88,80"/>
    </g>
  </g>

  <!-- Wordmark: small, bottom -->
  <text x="128" y="238" text-anchor="middle" font-family="monospace" font-size="11" fill="#e6edf3" opacity="0.5" letter-spacing="3">DLSS-SWAPPER</text>

</svg>
